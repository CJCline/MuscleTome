name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Gradle launcher)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The Gradle daemon JVM (JDK 25) is auto-provisioned per
      # gradle/gradle-daemon-jvm.properties via the foojay resolver.

      - name: Set up Gradle (caching + wrapper validation)
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Assemble release APK
        run: ./gradlew assembleRelease

      - name: Room schema JSON must be committed and up to date
        run: |
          STATUS="$(git status --porcelain -- app/schemas)"
          if [ -n "$STATUS" ]; then
            echo "::error::Room schema in app/schemas/ is not committed or is out of date:"
            echo "$STATUS"
            echo "Run ./gradlew assembleDebug and commit the regenerated schema files."
            exit 1
          fi
